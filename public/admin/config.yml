# Sveltia CMS — served statically from /admin/, no server to host.
#
# Auth: no OAuth proxy. Sign in with a fine-grained GitHub PAT scoped to this
# repository (Contents: Read and write). Sveltia stores the token in the
# browser, so it never lands in the repo.
backend:
  name: github
  repo: tingtom/site
  branch: main

site_url: https://tmathews.co.uk/site/
logo:
  src: /site/favicon.png

media_folder: public/images/uploads
public_folder: /images/uploads

collections:
  - name: posts
    label: Blog posts
    label_singular: Blog post
    folder: src/content/posts
    create: true
    slug: '{{slug}}'
    extension: md
    format: frontmatter
    summary: '{{title}} — {{date}}'
    fields:
      - { label: Title, name: title, widget: string }
      - { label: URL slug, name: slug, widget: string, required: false, hint: 'Leave blank to use the filename' }
      - { label: Date, name: date, widget: datetime, format: 'yyyy-MM-dd', date_format: 'yyyy-MM-dd', time_format: false }
      - { label: Reading time (minutes), name: mins, widget: number, value_type: int, default: 0, required: false }
      - { label: Summary, name: summary, widget: text, required: false, hint: 'Shown on cards and in meta descriptions' }
      - label: Appears in
        name: sections
        widget: select
        multiple: true
        options: [personal, rx7]
        default: [personal]
        hint: 'rx7 posts also show in the RX7 blog'
      - { label: Body, name: body, widget: markdown }

  - name: projects
    label: Projects
    folder: src/content/projects
    create: true
    slug: '{{slug}}'
    extension: md
    format: frontmatter
    summary: '{{title}}'
    fields:
      - { label: Title, name: title, widget: string }
      - { label: URL slug, name: slug, widget: string, required: false, hint: 'Leave blank to use the filename' }
      - { label: Summary, name: summary, widget: text, required: false }
      - label: Card image
        name: image
        widget: file
        required: false
        media_folder: public/images/projects
        public_folder: /images/projects
      - { label: Feature on the home page, name: homepage, widget: boolean, default: false }
      - label: Appears in
        name: sections
        widget: select
        multiple: true
        options: [personal, rx7]
        default: [personal]
      - { label: Body, name: body, widget: markdown }

  - name: models
    label: 3D models
    folder: src/content/models
    create: true
    slug: '{{slug}}'
    extension: md
    format: frontmatter
    summary: '{{title}}'
    fields:
      - { label: Title, name: title, widget: string }
      - { label: URL slug, name: slug, widget: string, required: false, hint: 'Leave blank to use the filename' }
      - { label: Description, name: description, widget: text, required: false }
      - label: Model file
        name: file
        widget: file
        hint: 'STL, OBJ or GLB — uploaded to public/models'
        media_folder: public/models
        public_folder: /models
      - label: Preview image
        name: preview
        widget: file
        required: false
        media_folder: public/images/models
        public_folder: /images/models
      - label: Category
        name: category
        widget: select
        required: false
        options:
          - { label: Engine parts, value: engine }
          - { label: Exterior, value: exterior }
          - { label: Interior, value: interior }
          - { label: Accessories, value: accessories }
      - { label: Downloads, name: downloads, widget: number, value_type: int, default: 0, required: false }
      - label: Appears in
        name: sections
        widget: select
        multiple: true
        options: [personal, rx7]
        default: [rx7]

  - name: diagrams
    label: Wiring diagrams
    label_singular: Wiring diagram
    folder: src/content/diagrams
    create: true
    slug: '{{slug}}'
    extension: md
    format: frontmatter
    summary: '{{title}} — {{category}}'
    fields:
      - { label: Title, name: title, widget: string }
      - { label: URL slug, name: slug, widget: string, required: false, hint: 'Leave blank to use the filename' }
      - { label: Description, name: description, widget: text, required: false }
      - label: Scans
        name: images
        widget: list
        allow_add: true
        hint: 'One entry per page — uploaded to public/diagrams'
        field:
          label: Scan
          widget: file
          media_folder: public/diagrams
          public_folder: /diagrams
      - { label: Category, name: category, widget: string, required: false, hint: 'e.g. Engine/ECU, Airbag, Chassis' }
      - { label: Year range, name: yearRange, widget: string, required: false, hint: 'e.g. 1993-1996' }
      - { label: Identifier, name: identifier, widget: string, required: false, hint: 'Alphanumeric code from the top-left corner that groups related pages' }
      - label: Wire colours
        name: wireColors
        widget: list
        allow_add: true
        field: { label: Colour, widget: string }
      - label: Components
        name: components
        widget: list
        allow_add: true
        field: { label: Component, widget: string }
      - label: Connectors
        name: connectors
        widget: list
        allow_add: true
        field: { label: Connector, widget: string }
      - label: ECU pins
        name: ecuPins
        widget: list
        allow_add: true
        field: { label: Pin, widget: string }
      - { label: Notes, name: notes, widget: text, required: false }
      - { label: Extraction confidence (0-1), name: confidence, widget: number, value_type: float, required: false }
      - label: Appears in
        name: sections
        widget: select
        multiple: true
        options: [personal, rx7]
        default: [rx7]
