# Sveltia CMS — served statically from /admin/, no server to host.
#
# Auth: no OAuth proxy. Sign in with a fine-grained GitHub PAT scoped to this
# repository (Contents: Read and write). Sveltia stores the token in the
# browser, so it never lands in the repo.
backend:
  name: github
  repo: tingtom/site
  branch: main

site_url: https://tmathews.co.uk/site/
logo:
  src: /site/favicon.png

media_folder: /public/images/uploads
public_folder: /images/uploads

collections:
  - name: posts
    label: Blog posts
    label_singular: Blog post
    folder: src/content/posts
    create: true
    slug: '{{slug}}'
    extension: md
    format: frontmatter
    summary: '{{title}} — {{date}}'
    fields:
      - { label: Title, name: title, widget: string }
      - { label: URL slug, name: slug, widget: string, required: false, hint: 'Leave blank to use the filename' }
      # `format` and `date_format` use Day.js tokens (Sveltia formats with
      # Day.js): `yyyy-MM-dd` yields "yyyy-11-Su" because Day.js reads `dd` as
      # the short weekday and has no `yyyy` token at all. YYYY-MM-DD is correct.
      - { label: Date, name: date, widget: datetime, format: 'YYYY-MM-DD', date_format: 'YYYY-MM-DD', time_format: false }
      - { label: Reading time (minutes), name: mins, widget: number, value_type: int, default: 0, required: false }
      - { label: Summary, name: summary, widget: text, required: false, hint: 'Shown on cards and in meta descriptions' }
      - label: Appears in
        name: sections
        widget: select
        multiple: true
        options: [personal, rx7]
        default: [personal]
        hint: 'rx7 posts also show in the RX7 blog'
      - { label: Body, name: body, widget: markdown }

  - name: projects
    label: Projects
    folder: src/content/projects
    create: true
    slug: '{{slug}}'
    extension: md
    format: frontmatter
    summary: '{{title}}'
    fields:
      - { label: Title, name: title, widget: string }
      - { label: URL slug, name: slug, widget: string, required: false, hint: 'Leave blank to use the filename' }
      - { label: Summary, name: summary, widget: text, required: false }
      - label: Card image
        name: image
        widget: file
        required: false
        media_folder: /public/images/projects
        public_folder: /images/projects
      - { label: Feature on the home page, name: homepage, widget: boolean, default: false }
      - label: Appears in
        name: sections
        widget: select
        multiple: true
        options: [personal, rx7]
        default: [personal]
      - { label: Body, name: body, widget: markdown }

  - name: models
    label: 3D models
    folder: src/content/models
    create: true
    slug: '{{slug}}'
    extension: md
    format: frontmatter
    summary: '{{title}}'
    fields:
      - { label: Title, name: title, widget: string }
      - { label: URL slug, name: slug, widget: string, required: false, hint: 'Leave blank to use the filename' }
      - { label: Description, name: description, widget: text, required: false }
      - label: Notes
        name: notes
        widget: text
        required: false
        hint: 'Second line under the description — print time, material, provenance. Model pages show no body text.'
      - label: Model file
        name: file
        widget: file
        hint: 'STL, 3MF, OBJ, GLB or glTF — uploaded to public/models'
        media_folder: /public/models
        public_folder: /models
      - label: Model orientation
        name: orientation
        widget: select
        required: false
        default: fix
        hint: 'How to show this model. The default lays a Z-up CAD export down, and is correct for almost everything — check it only if a model arrives upside down or on edge.'
        options:
          - { label: Laid down (default), value: fix }
          - { label: Laid down, the other way up, value: flip }
          - { label: Turned onto its side, value: side }
          - { label: Exactly as exported, value: asis }
      - label: Turn (degrees)
        name: yaw
        widget: number
        value_type: int
        required: false
        default: 0
        hint: 'Spins the model about the vertical without changing which face is down — use it to stop a model balancing on a point. 0, 90, 180 and 270 are the useful values; the query string ?yaw= previews one without saving.'
      - label: Exact rotation
        name: rotation
        widget: string
        required: false
        default: ''
        hint: 'x,y,z in degrees. Overrides both fields above — use it when no preset sits right, which happens on a curved part with no flat face. Open the model page with ?rotate to drag it until it looks right; the console prints this line as you let go.'
      - label: Preview image
        name: preview
        widget: file
        required: false
        media_folder: /public/images/models
        public_folder: /images/models
      - label: Category
        name: category
        widget: select
        required: false
        options:
          - { label: Engine parts, value: engine }
          - { label: Exterior, value: exterior }
          - { label: Interior, value: interior }
          - { label: Accessories, value: accessories }
      - { label: Downloads, name: downloads, widget: number, value_type: int, default: 0, required: false }
      - label: Designed by
        name: credit
        widget: string
        required: false
        hint: 'Leave blank for your own model. Name the designer if someone else made it.'
      - label: Licence
        name: licence
        widget: string
        required: false
        hint: 'e.g. CC BY-NC-ND 4.0 — shown next to the credit'
      - label: Source page
        name: source
        widget: string
        required: false
        hint: 'Where the files originally come from, linked from the detail page'
      - label: More downloads
        name: files
        widget: list
        required: false
        hint: 'Extra files — the other side of a pair, STEP originals, print notes. Upload a file OR paste a URL per row. A row whose address matches the model file relabels that download instead of adding a second one.'
        fields:
          - { label: Label, name: label, widget: string, hint: 'e.g. Right — STL' }
          - label: Upload a file
            name: file
            widget: file
            required: false
            hint: 'Uploaded to public/models — leave empty to use the URL below instead'
            media_folder: /public/models
            public_folder: /models
          - { label: Or link to it, name: href, widget: string, required: false, hint: 'A full https URL, or a path in public/ starting with / — leave empty if you uploaded' }
          - { label: Note, name: note, widget: string, required: false, hint: 'e.g. printable · passenger side · 1.8 MB' }
      - label: Appears in
        name: sections
        widget: select
        multiple: true
        options: [personal, rx7]
        default: [rx7]

  - name: diagrams
    label: Wiring diagrams
    label_singular: Wiring diagram
    folder: src/content/diagrams
    create: true
    slug: '{{slug}}'
    extension: md
    format: frontmatter
    summary: '{{title}} — {{category}}'
    fields:
      - { label: Title, name: title, widget: string }
      - { label: URL slug, name: slug, widget: string, required: false, hint: 'Leave blank to use the filename' }
      - { label: Description, name: description, widget: text, required: false }
      - label: Scans
        name: images
        widget: list
        allow_add: true
        hint: 'One entry per page — uploaded to public/diagrams'
        field:
          # `name` is required by Sveltia's schema even for a scalar list —
          # the value stays a plain array of file paths.
          name: file
          label: Scan
          widget: file
          media_folder: /public/diagrams
          public_folder: /diagrams
      - { label: Category, name: category, widget: string, required: false, hint: 'e.g. Engine/ECU, Airbag, Chassis' }
      - { label: Year range, name: yearRange, widget: string, required: false, hint: 'e.g. 1993-1996' }
      - { label: Identifier, name: identifier, widget: string, required: false, hint: 'Alphanumeric code from the top-left corner that groups related pages' }
      - label: Wire colours
        name: wireColors
        widget: list
        allow_add: true
        field: { name: color, label: Colour, widget: string }
      - label: Components
        name: components
        widget: list
        allow_add: true
        field: { name: component, label: Component, widget: string }
      - label: Connectors
        name: connectors
        widget: list
        allow_add: true
        field: { name: connector, label: Connector, widget: string }
      - label: ECU pins
        name: ecuPins
        widget: list
        allow_add: true
        field: { name: pin, label: Pin, widget: string }
      - { label: Notes, name: notes, widget: text, required: false }
      - { label: Extraction confidence (0-1), name: confidence, widget: number, value_type: float, required: false }
      - label: Appears in
        name: sections
        widget: select
        multiple: true
        options: [personal, rx7]
        default: [rx7]
