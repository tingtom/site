name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # A push that touches only CI config or dev tooling produces an identical
    # dist, so it should not cost a build and deploy. Patterns here are
    # root-scoped (`*.md` does not cross `/`), so content under src/content and
    # everything in public/ still triggers a deploy — this only skips pushes
    # where nothing the site is built from changed.
    paths-ignore:
      - '.github/**'
      - 'scripts/**'
      - '*.md'
      - '.gitignore'
      - '.editorconfig'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Newest push wins. Sveltia commits on every save, so without this a run of
  # quick edits queues behind each other and each waits its full turn.
  # Cancelling an in-flight run cannot take the site down: Pages keeps serving
  # the last successful deployment, and the newer run deploys newer content
  # anyway.
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # PUBLIC_BASE is the path the site is served under. It is '/site/' for the
      # project-page URL; switch it to '/' when the custom domain takes over.
      - name: Build
        run: npm run build
        env:
          PUBLIC_BASE: /site/
          PUBLIC_SITE_URL: https://tmathews.co.uk/site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # A healthy deploy finishes in 20-32s, but the action's default timeout is
      # 10 minutes: when GitHub's Pages API accepts the deployment and then
      # never reports a status, the run sits polling for the full 10 minutes
      # before aborting. Four runs were lost to that this week.
      #
      # Cap each attempt at 3 minutes — still 5x the slowest success seen — and
      # retry once, so a transient blip recovers on its own and a genuinely
      # wedged deployment fails in ~3 minutes instead of 10. A retry against
      # the same artifact only helps for transient faults; a SHA-specific wedge
      # still needs a new commit, but at least it is obvious quickly.
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 180000
        continue-on-error: true

      - id: deployment2
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          timeout: 180000
